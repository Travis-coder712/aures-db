name: Archive AEMO Generation Information

# Opens a GitHub Issue on the 3rd of each month reminding you to archive
# the new AEMO NEM Generation Information Excel locally.
#
# AEMO blocks GitHub Actions IPs, so the download must be done locally:
#   python3 pipeline/importers/import_aemo_gen_info.py
#   git add data/gi_snapshots/ && git commit && git push
#
# The issue auto-checks whether this month's snapshot already exists in git;
# if it does, no issue is opened.
on:
  schedule:
    - cron: "0 1 3 * *"    # 01:00 UTC on the 3rd — AEMO publishes ~1st of each month
  workflow_dispatch:
    inputs:
      snapshot:
        description: "YYYY-MM to check (blank = current month)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check if this month's GI snapshot is already archived
        id: check
        run: |
          S="${{ github.event.inputs.snapshot }}"
          [ -z "$S" ] && S="$(date -u +%Y-%m)"
          DEST="data/gi_snapshots/gi-${S}.xlsx"
          echo "snapshot=$S" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          if [ -f "$DEST" ]; then
            echo "already_archived=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot $DEST already archived — no reminder needed."
          else
            echo "already_archived=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot $DEST not found — will open reminder issue."
          fi

      - name: Open GI archive reminder issue
        if: steps.check.outputs.already_archived == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const snap = '${{ steps.check.outputs.snapshot }}';
            const dest = '${{ steps.check.outputs.dest }}';
            const body = [
              '## AEMO GI Archive — ' + snap,
              '',
              'The AEMO NEM Generation Information Excel for **' + snap + '** has not been archived yet.',
              'AEMO typically publishes on the 1st of each month and removes previous releases.',
              '',
              '### Run locally',
              '```bash',
              'cd ~/aures-db',
              'python3 pipeline/importers/import_aemo_gen_info.py',
              '```',
              '',
              'This downloads the current GI Excel, imports it into the local DB, and saves a',
              'snapshot to `' + dest + '`.',
              '',
              '### Commit the snapshot',
              '```bash',
              'git add ' + dest,
              'git commit -m "chore(data): archive AEMO GI ' + snap + '"',
              'git push',
              '```',
              '',
              'Close this issue once done.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DATA] Archive AEMO GI ' + snap,
              labels: ['data-refresh'],
              body,
            });
            console.log('Opened GI archive reminder issue for ' + snap);
