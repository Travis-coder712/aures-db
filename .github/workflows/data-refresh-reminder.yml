name: Monthly data refresh reminder

# Opens a GitHub Issue on the 5th of each month reminding you to run the
# AURES local data refresh pipeline. AURES uses a 4 GB local SQLite DB
# that cannot run on GitHub Actions, so the pipeline must be run manually.
#
# The issue links to the DATA_REFRESH.md runbook and closes itself when
# the freshness-watch workflow passes (i.e., data was actually updated).
on:
  schedule:
    - cron: "0 21 5 * *"    # 21:00 UTC 5th of month (07:00 AEST 6th)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check if data is already fresh (skip issue if so)
        id: check
        run: |
          MAX_AGE=20
          DATA="frontend/public/data/analytics/intelligence/scheme-tracker.json"
          LAST=$(git log -1 --format="%ct" -- "$DATA" 2>/dev/null)
          NOW=$(date -u +%s)
          if [ -n "$LAST" ]; then
            AGE=$(( (NOW - LAST) / 86400 ))
            echo "age_days=$AGE" >> "$GITHUB_OUTPUT"
            if [ "$AGE" -lt "$MAX_AGE" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Data is fresh ($AGE days) — no reminder needed."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "Data is stale ($AGE days) — will open reminder issue."
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "age_days=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Open reminder issue
        if: steps.check.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const age = '${{ steps.check.outputs.age_days }}';
            const month = new Date().toLocaleString('en-AU', { month: 'long', year: 'numeric', timeZone: 'Australia/Melbourne' });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[DATA] Monthly refresh due — ${month}`,
              labels: ['data-refresh'],
              body: `## AURES Monthly Data Refresh

**Last intelligence update:** ${age} days ago

The AURES pipeline runs locally (4 GB SQLite DB). Time to run the refresh.

### Quick refresh (performance data + re-export)
\`\`\`bash
cd ~/aures-db
python3 pipeline/smart_refresh.py --phase all
\`\`\`

### Commit and deploy
\`\`\`bash
git add frontend/public/data
git commit -m "data: monthly refresh $(date +%Y-%m)"
git push
\`\`\`

### Full monthly runbook
See [docs/DATA_REFRESH.md](../blob/main/docs/DATA_REFRESH.md) for the complete importer order,
including AEMO GI Excel, EPBC, MLF history, and other periodic imports.

### This month's checklist
- [ ] \`import_aemo_gen_info.py\` — check for new GI release (AEMO publishes ~1st)
- [ ] \`python3 pipeline/smart_refresh.py --phase all\` — OE performance + export
- [ ] \`import_news_rss.py\` (daily, but verify it ran recently)
- [ ] \`import_epbc.py\` — EPBC referral updates (weekly cadence)
- [ ] \`validate_status.py\` — check for any status regressions

Close this issue once the refresh is done and pushed.
`
            });
